version: '3.4'

services:
  dockermysqlvkmini:
    image: mysql
    ports:
      - 3306:3306
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: 12345atomdev
      MYSQL_USER: atomdevadmin
      MYSQL_PASSWORD: 12345atomdev
      MYSQL_DATABASE: VKminiapp
    volumes:
      - /usr/mysql:/var/lib/mysql
      #- ./API_AtomHack/Migration.sql:/docker-entrypoint-initdb.d/1.sql
      - ./VK-mini-app/Isu.json:/Isu.json
      - ./VK-mini-app/categories.json:/categories.json
      - ./VK-mini-app/tasks.json:/tasks.json
    healthcheck:
      test: mysqladmin ping -h 127.0.0.1 -u $$MYSQL_USER --password=$$MYSQL_PASSWORD
      start_period: 5s
      interval: 5s
      timeout: 5s
      retries: 10
  vk-mini-app:
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_HTTP_PORTS=8080
      - ASPNETCORE_HTTPS_PORTS=8081
      - ASPNETCORE_Kestrel__Certificates__Default__Password=crypticpassword
      - ASPNETCORE_Kestrel__Certificates__Default__Path=VK-mini-app.pfx 
    depends_on: 
      dockermysqlvkmini:
        condition: service_healthy
    ports:
      - 5000:8080
      - 5001:8081
    volumes:
      - ${APPDATA}/Microsoft/UserSecrets:/home/app/.microsoft/usersecrets:ro
      - ${APPDATA}/ASP.NET/Https:/home/app/.aspnet/https:ro
  proxy:
    image: nginx:latest
    depends_on: 
      - vk-mini-app
    volumes:
      - ./VK-mini-app/nginx.conf:/etc/nginx/nginx.conf
      - ./VK-mini-app/VKminiapp.crt:/etc/nginx/VKminiapp.crt
      - ./VK-mini-app/VKminiapp.key:/etc/nginx/VKminiapp.key
    ports:
      - 80:80
      - 443:443